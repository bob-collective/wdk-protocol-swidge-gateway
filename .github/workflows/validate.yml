name: WDK Gateway — validate (quote + simulate, no swap)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: Validate quote + simulate (mainnet, no swap)
    runs-on: bob-ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Runner diagnostics
        run: bash scripts/runner-recon.sh
